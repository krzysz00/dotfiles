profile = "default"
[model_providers.custom-gateway]
name = "AMD LLM Gateway"
base_url = "https://llm-api.amd.com/OpenAI"
wire_api = "responses"
# Maps the header name to an environment variable name
env_http_headers = { "Ocp-Apim-Subscription-Key" = "AMD_LLM_API_KEY" }
[profiles.default]
model_provider = "custom-gateway"
model = "gpt-5.5"
model_reasoning_effort = "xhigh"
[features]
multi_agent = true
apps = true
[sandbox_workspace_write]
writable_roots = [
    "/home/kdrewnia/.cache/ccache/",
    "/home/krzys/.cache/ccache/",
    "/home/kdrewnia/reviews/",
    "/home/krzys/reviews/"
]
